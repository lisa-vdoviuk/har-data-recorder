<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HAR Project Data Recorder</title>
<style>
:root{
  --bg:#0b0e14; --panel:#131822; --soft:#192030; --line:#262f40; --ink:#e6ebf3; --muted:#8a95a9; --field:#0e121a;
  --blue:#5b7bff; --blue-soft:#1a2450; --rec:#ff5a6e; --rec-soft:#3b1a22; --ok:#34d399; --ok-soft:#0f2f26;
  --warn:#f2b84b; --warn-soft:#3a2e12; --live-bg:#080b10; --btn-hover:#34405a; --toast:#2a3347;
  --font:"Avenir Next","Segoe UI","Helvetica Neue",system-ui,sans-serif;
  --num:"SF Mono","Cascadia Mono","Roboto Mono",ui-monospace,monospace;
}
:root[data-theme="light"]{
  --bg:#eceef2; --panel:#fff; --soft:#f5f6f9; --line:#dde1e8; --ink:#1a2233; --muted:#667186; --field:#fff;
  --blue:#2a4bff; --blue-soft:#e6eaff; --rec:#df3149; --rec-soft:#fde8eb; --ok:#14a06b; --ok-soft:#dff5ec;
  --warn:#b7791f; --warn-soft:#fdf1d8; --live-bg:#1a2233; --btn-hover:#c9cfda; --toast:#1a2233;
}
*{box-sizing:border-box}
html{color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
.mono{font-family:var(--num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}

header{display:flex;align-items:center;justify-content:space-between;padding:18px 28px}
.brand{display:flex;align-items:center;gap:12px}
.brand h1{font-size:19px}
.hstat{display:flex;gap:10px;align-items:center}

main{display:grid;grid-template-columns:minmax(330px,400px) 1fr;gap:20px;padding:0 28px 40px;max-width:1500px;margin:0 auto;align-items:start}
@media(max-width:980px){main{grid-template-columns:1fr;padding:0 14px 30px}header{padding:14px}}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.panel-h h2{font-size:17px}

.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 13px;font-weight:550;transition:background .12s,border-color .12s}
.btn:hover{background:var(--soft);border-color:var(--btn-hover)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{filter:brightness(1.12)}
.btn.danger{color:var(--rec)}
.btn.danger:hover{background:var(--rec-soft);border-color:var(--rec)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--soft)}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.err{background:var(--rec-soft);color:var(--rec)}
.pill.blue{background:var(--blue-soft);color:var(--blue)}

/* ----- sensors ----- */
.add{display:flex;gap:8px;margin-bottom:14px}
.add input{flex:1;min-width:0}
input[type=text],input[type=number],select{border:1px solid var(--line);background:var(--field);border-radius:9px;padding:8px 11px;width:100%}
input:focus,select:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px var(--blue-soft)}
.sensors{display:flex;flex-direction:column;gap:10px}
.sensor{border:1px solid var(--line);border-left:5px solid var(--c);border-radius:11px;padding:12px 14px;background:var(--panel)}
.sensor.off{background:var(--soft)}
.sensor.identifying{animation:pulse .6s ease-in-out infinite alternate}
@keyframes pulse{to{background:color-mix(in srgb,var(--c) 18%,var(--panel))}}
.s-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.s-title{font-weight:650;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-title.none{color:var(--muted);font-weight:500}
.s-sub{font-size:12.5px;color:var(--muted)}
.s-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--field);border-radius:99px;padding:2px 10px;font-size:12.5px}
.chip:hover{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,var(--panel))}
.chip.on{background:var(--c);border-color:var(--c);color:#fff}
.check{display:flex;gap:7px;align-items:center;font-size:13.5px;margin-left:auto;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--blue)}
.err-t{color:var(--rec);font-size:13px;margin-top:8px}
.spin{width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .7s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}
.empty{border:1.5px dashed var(--line);border-radius:11px;padding:22px;text-align:center;color:var(--muted)}

/* ----- record ----- */
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.lab{font-size:13.5px;font-weight:600;color:var(--muted)}
.big-in{font-size:20px;padding:12px 14px;font-weight:600}
.row{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start;margin-top:18px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--field)}
.seg button{border:0;background:none;padding:8px 14px;border-right:1px solid var(--line);font-weight:550}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--soft)}
.seg button.on{background:var(--blue);color:#fff}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:6px}
@media(max-width:700px){.grid4{grid-template-columns:repeat(2,1fr)}}
.group-t{font-size:13.5px;font-weight:600;margin-top:18px}
.who{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.who span{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:3px 11px 3px 8px;font-size:13px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none;display:inline-block}
.go{display:flex;align-items:center;gap:16px;margin-top:22px;flex-wrap:wrap}
.rec-btn{display:inline-flex;align-items:center;gap:10px;background:var(--rec);color:#fff;border:0;border-radius:12px;padding:15px 30px;font-size:17px;font-weight:650}
.rec-btn:hover{filter:brightness(1.1)}
.rec-btn:disabled{background:var(--soft);color:var(--muted);cursor:not-allowed}
.rec-btn .o{width:13px;height:13px;border-radius:50%;background:#fff}
.stop-btn{background:#2f3a50}.stop-btn:hover{background:#3d4a66;filter:none}
.stop-btn .o{border-radius:3px}

.live{border-radius:12px;background:var(--live-bg);border:1px solid var(--line);color:#fff;padding:22px 24px;margin:-2px 0 0}
.live .t{font-size:clamp(46px,8vw,84px);line-height:1;font-weight:600;letter-spacing:-.02em}
.live .m{font-size:18px;opacity:.85;margin-bottom:6px}
.live .bar{height:6px;border-radius:3px;background:#ffffff26;margin:16px 0 0;overflow:hidden}
.live .bar i{display:block;height:100%;background:#fff;transition:width .4s linear}
.live .rd{display:inline-block;width:11px;height:11px;border-radius:50%;background:#ff4b62;margin-right:9px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.live .cd{color:#9db0ff}
.srow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #ffffff1f;font-size:14px}
.srow:first-child{border-top:0}
.srow .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .st{opacity:.85;font-size:13.5px}
.live .dot{box-shadow:0 0 0 2px #fff3}
.live-actions{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:16px;flex-wrap:wrap}

/* ----- recordings ----- */
.session{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.s-head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;background:var(--soft)}
.s-head h3{font-size:17px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:12.5px;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:0 7px;color:var(--muted)}
.frow{display:grid;grid-template-columns:minmax(150px,1.4fr) 1fr 1fr auto;gap:10px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
@media(max-width:700px){.frow{grid-template-columns:1fr 1fr}}
.fname{display:flex;align-items:center;gap:9px;min-width:0}
.fname b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acts{display:flex;gap:6px;justify-content:flex-end}

.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);background:var(--toast);color:#fff;padding:11px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:9;max-width:90vw;font-weight:550}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--rec)}.toast.warn{background:#9a6a12}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.pbar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;border:1px solid var(--line)}
.pbar i{display:block;height:100%;background:var(--blue);transition:width .3s}
.pbar.ind i{width:30%!important;animation:ind 1.1s ease-in-out infinite alternate}
@keyframes ind{from{margin-left:0}to{margin-left:70%}}
.pbar.done i{background:var(--ok)}.pbar.err i{background:var(--rec)}
.dl-row{display:grid;grid-template-columns:minmax(120px,1fr) 2fr minmax(170px,1.2fr);gap:12px;align-items:center;padding:6px 0;font-size:14px}
@media(max-width:700px){.dl-row{grid-template-columns:1fr 1fr}}
.bat{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);background:none;border:0;padding:2px 4px;border-radius:6px}
.bat:hover{background:var(--soft)}
.bat i{width:22px;height:11px;border:1.5px solid currentColor;border-radius:3px;position:relative;display:inline-block;padding:1px}
.bat i::after{content:"";position:absolute;right:-4px;top:2px;width:2px;height:4px;background:currentColor;border-radius:0 1px 1px 0}
.bat b{display:block;height:100%;background:var(--ok);border-radius:1px}
.bat.mid b{background:var(--warn)}.bat.low b{background:var(--rec)}
.lp canvas{width:100%;height:150px;display:block;background:var(--field);border:1px solid var(--line);border-radius:10px}
.ch-head{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 6px;gap:10px;flex-wrap:wrap}
.lg{font-weight:600;font-size:13px}.lg.x{color:#ff6b81}.lg.y{color:#34d399}.lg.z{color:#5b9bff}
</style>
<script>document.documentElement.dataset.theme=localStorage.getItem("mwr_theme")||"dark"</script>
</head>
<body>
<header>
  <div class="brand"><h1>HAR Project Data Recorder</h1></div>
  <div style="display:flex;gap:12px;align-items:center"><div class="hstat" id="hstat"></div><button class="btn sm" id="themeBtn"></button></div>
</header>

<main>
  <!-- ===== Sensors ===== -->
  <section class="panel" aria-labelledby="h-sens">
    <div class="panel-h">
      <h2 id="h-sens">Sensors</h2>
      <button class="btn primary" id="scanBtn">Find sensors</button>
    </div>
    <div class="add">
      <input type="text" id="macIn" placeholder="Add by MAC: F0:F3:20:73:56:3A" spellcheck="false" aria-label="MAC address">
      <button class="btn" id="macAdd">Add</button>
    </div>
    <div class="sensors" id="sensorList"></div>
  </section>

  <div class="col">
    <!-- ===== Record ===== -->
    <section class="panel" aria-labelledby="h-rec">
      <div class="panel-h"><h2 id="h-rec">New recording</h2><span id="recHint" class="small muted"></span></div>

      <div id="liveBox" hidden></div>

      <div id="setup">
        <div class="row" style="margin-top:0">
          <div class="field" style="width:190px">
            <label for="subject">Subject ID</label>
            <input type="text" class="big-in" id="subject" placeholder="S01" autocomplete="off" maxlength="40">
          </div>
          <div class="field" style="flex:1;min-width:240px">
            <label for="movement">Activity (label)</label>
            <input type="text" class="big-in" id="movement" placeholder="e.g. walking, squat, climbing stairs" autocomplete="off">
            <div class="chips" id="moveChips" style="margin-top:2px"></div>
          </div>
        </div>

        <div class="row">
          <div class="field">
            <span class="lab">Duration</span>
            <div class="seg" id="durSeg">
              <button data-d="5">5 s</button><button data-d="10">10 s</button><button data-d="30">30 s</button>
              <button data-d="60">1 min</button><button data-d="0">No limit</button>
            </div>
          </div>
          <div class="field" style="width:120px">
            <label for="durCustom">Custom (s)</label>
            <input type="number" id="durCustom" min="1" step="1" placeholder="—">
          </div>
          <div class="field">
            <span class="lab">Countdown before start</span>
            <div class="seg" id="cdSeg">
              <button data-c="0">None</button><button data-c="3">3 s</button><button data-c="5">5 s</button><button data-c="10">10 s</button>
            </div>
          </div>
        </div>
        <div class="small muted" id="durNote" style="margin-top:8px"></div>
        <div class="row" style="margin-top:14px">
          <div class="field">
            <span class="lab">After each take</span>
            <div class="seg" id="trSeg"><button data-t="later">Keep on sensors, download later</button><button data-t="now">Download now</button></div>
          </div>
        </div>
        <div class="small muted" id="trNote" style="margin-top:8px"></div>

        <div class="group-t">Channels and sensor settings</div>
        <div class="row" style="margin-top:8px;gap:22px">
          <label class="check" style="margin:0"><input type="checkbox" id="useAcc"> Accelerometer</label>
          <label class="check" style="margin:0"><input type="checkbox" id="useGyro"> Gyroscope</label>
          <label class="check" style="margin:0"><input type="checkbox" id="metaCols"> Extra metadata columns in CSV</label>
        </div>
        <div class="grid4">
          <div class="field"><label for="acc_odr">Accelerometer rate</label><select id="acc_odr"></select></div>
          <div class="field"><label for="acc_range">Accelerometer range</label><select id="acc_range"></select></div>
          <div class="field"><label for="gyro_odr">Gyroscope rate</label><select id="gyro_odr"></select></div>
          <div class="field"><label for="gyro_range">Gyroscope range</label><select id="gyro_range"></select></div>
        </div>

        <div class="group-t">Recording from</div>
        <div class="who" id="who"></div>

        <div class="go">
          <button class="rec-btn" id="startBtn"><span class="o"></span>Start recording</button>
          <span class="small muted" id="why"></span>
        </div>
      </div>
    </section>

    <!-- ===== Live preview ===== -->
    <section class="panel lp" aria-labelledby="h-lp">
      <div class="panel-h">
        <div><h2 id="h-lp">Live preview</h2><div class="small muted">Streams one sensor over Bluetooth to check the signal. Nothing is saved.</div></div>
        <button class="btn primary" id="lpBtn">Start preview</button>
      </div>
      <div class="row" style="margin-top:0;gap:14px;align-items:flex-end">
        <div class="field" style="min-width:200px;flex:1"><label for="lpSensor">Sensor</label><select id="lpSensor"></select></div>
        <div class="field" style="width:120px"><label for="lpRate">Rate</label><select id="lpRate"><option value="25">25 Hz</option><option value="50" selected>50 Hz</option><option value="100">100 Hz</option></select></div>
        <label class="check" style="margin:0 0 9px"><input type="checkbox" id="lpAcc" checked> Accelerometer</label>
        <label class="check" style="margin:0 0 9px"><input type="checkbox" id="lpGyro" checked> Gyroscope</label>
      </div>
      <div id="lpCharts" hidden>
        <div class="ch-head"><b>Accelerometer <span class="muted small">g</span></b><span class="mono small" id="lpAccVal"></span></div><canvas id="cAcc"></canvas>
        <div class="ch-head"><b>Gyroscope <span class="muted small">°/s</span></b><span class="mono small" id="lpGyroVal"></span></div><canvas id="cGyro"></canvas>
        <div class="small muted" id="lpStat" style="margin-top:8px"></div>
      </div>
    </section>

    <!-- ===== Pending ===== -->
    <section class="panel" id="pendingPanel" hidden></section>

    <!-- ===== Dashboard ===== -->
    <section class="panel" aria-labelledby="h-list">
      <div class="panel-h">
        <h2 id="h-list">Recordings</h2>
        <div style="display:flex;gap:8px;align-items:center">
          <span class="small muted" id="listCount"></span>
          <button class="btn" id="zipAll">Download all (ZIP)</button>
        </div>
      </div>
      <div id="recList"></div>
    </section>
  </div>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LABELS = ["Right arm","Left arm","Right wrist","Left wrist","Right leg","Left leg","Waist","Chest","Back","Head"];
const hue = mac => { let h = 0; for (const c of mac) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const color = mac => `hsl(${hue(mac)} 62% 46%)`;
const fmtT = s => { s = Math.max(0, s); const m = Math.floor(s / 60); return String(m).padStart(2,"0") + ":" + (s % 60).toFixed(1).padStart(4,"0"); };
const fmtSize = b => b > 1048576 ? (b/1048576).toFixed(1)+" MB" : Math.max(1, Math.round(b/1024))+" KB";

let liveTimer = null, lpSig = "", pendSig = "", lastScanErr = null, S = null, recs = [], sig = "", liveSig = "", lastNoticeId = null, lastPhase = "idle", whoSig = "";
const prefs = Object.assign({ subject:"S01", use_acc:true, use_gyro:true, meta_cols:true, lpSensor:"", movement:"", duration:10, countdown:3, transfer:"later", acc_odr:100, acc_range:8, gyro_odr:100, gyro_range:2000 },
  JSON.parse(localStorage.getItem("mwr_prefs") || "{}"));
const savePrefs = () => localStorage.setItem("mwr_prefs", JSON.stringify(prefs));

async function api(path, method = "GET", body) {
  const r = await fetch(path, { method, headers: {"Content-Type":"application/json"}, body: body ? JSON.stringify(body) : undefined });
  let j = {}; try { j = await r.json(); } catch {}
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
let toastT;
function toast(text, level = "ok") {
  const t = $("#toast"); t.textContent = text; t.className = "toast show " + level;
  clearTimeout(toastT); toastT = setTimeout(() => t.className = "toast " + level, 4200);
}
const guard = fn => async (...a) => { try { await fn(...a); } catch (e) { toast(e.message, "err"); } };

/* ---------------- theme ---------------- */
function paintTheme() { $("#themeBtn").textContent = document.documentElement.dataset.theme === "light" ? "Dark mode" : "Light mode"; }
$("#themeBtn").onclick = () => {
  const t = document.documentElement.dataset.theme === "light" ? "dark" : "light";
  document.documentElement.dataset.theme = t; localStorage.setItem("mwr_theme", t); paintTheme();
};
paintTheme();

/* ---------------- sensors ---------------- */
function statusPill(s) {
  if (s.state === "connecting") return `<span class="pill blue"><span class="spin"></span>Connecting</span>`;
  if (s.state === "connected") return `<span class="pill ok">Connected</span>`;
  if (s.state === "error") return `<span class="pill err">Error</span>`;
  return s.nearby ? `<span class="pill warn">In range</span>` : `<span class="pill">Not in range</span>`;
}
function batteryHtml(s) {
  const b = s.battery;
  if (!b) return `<button class="bat" data-act="battery" title="Read battery">Battery: reading…</button>`;
  const cls = b.charge < 20 ? "low" : b.charge < 45 ? "mid" : "";
  return `<button class="bat ${cls}" data-act="battery" title="${b.voltage} mV. Click to refresh"><i><b style="width:${Math.max(4, b.charge)}%"></b></i>${b.charge}% · ${(b.voltage / 1000).toFixed(2)} V</button>`;
}
function sensorCard(s, busy) {
  const on = s.state === "connected";
  const c = color(s.mac);
  const title = s.label ? `<div class="s-title">${esc(s.label)}</div>` : `<div class="s-title none">No label</div>`;
  let body = "";
  if (on) {
    body = `
      <input type="text" data-label value="${esc(s.label)}" placeholder="Where it is worn: right arm, waist…" maxlength="40" style="margin-top:10px">
      <div class="chips">${LABELS.map(l => `<button class="chip ${l === s.label ? "on" : ""}" data-act="chip" data-v="${esc(l)}">${l}</button>`).join("")}</div>
      <div class="s-row" style="margin-top:8px">${batteryHtml(s)}</div>
      <div class="s-row">
        <button class="btn sm" data-act="identify" ${busy || s.identifying ? "disabled" : ""}>${s.identifying ? "Vibrating…" : "Identify (vibrate)"}</button>
        <button class="btn sm ghost" data-act="disconnect" ${busy ? "disabled" : ""}>Disconnect</button>
        <label class="check"><input type="checkbox" data-act="select" ${s.selected ? "checked" : ""}>In recording</label>
      </div>`;

/* ---------------- live preview ---------------- */
const live = { acc: [], gyro: [], seq: 0, busy: false };
const WINDOW = 10000, COLORS = ["#ff6b81", "#34d399", "#5b9bff"];
function drawChart(cv, data, minScale, digits) {

  if (cv.width !== Math.round(w * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  const c = cv.getContext("2d"); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, w, h);
  const css = getComputedStyle(document.documentElement), grid = css.getPropertyValue("--line").trim(), mut = css.getPropertyValue("--muted").trim();
  const tNow = data.length ? data[data.length - 1][0] : 0, t0 = tNow - WINDOW;
  let m = minScale;
  for (const d of data) if (d[0] >= t0) m = Math.max(m, Math.abs(d[1]), Math.abs(d[2]), Math.abs(d[3]));
  m = Math.max(m * 1.1, (cv._m || 0) * 0.985); cv._m = m;
  c.lineWidth = 1; c.strokeStyle = grid; c.fillStyle = mut; c.font = "11px " + css.getPropertyValue("--num");
  for (const f of [-1, -0.5, 0, 0.5, 1]) {
    const y = h / 2 - f * (h / 2 - 8); c.globalAlpha = f === 0 ? 1 : .5;
    c.beginPath(); c.moveTo(0, y); c.lineTo(w, y); c.stroke(); c.globalAlpha = 1;
    if (f === 1 || f === 0 || f === -1) c.fillText((f * m).toFixed(digits), 4, y - 3);
  }
  for (let k = 0; k < 3; k++) {
    c.strokeStyle = COLORS[k]; c.lineWidth = 1.6; c.beginPath(); let started = false;
    for (const d of data) {
      if (d[0] < t0) continue;
      const x = (d[0] - t0) / WINDOW * w, y = h / 2 - d[k + 1] / m * (h / 2 - 8);
      started ? c.lineTo(x, y) : (c.moveTo(x, y), started = true);
    }
    c.stroke();
  }
}
function hz(data) {

}

    $("#lpAccVal").innerHTML = fmt(live.acc, 2); $("#lpGyroVal").innerHTML = fmt(live.gyro, 1);

  else if (a === "delSession" && confirm("Delete this whole recording with all its CSV files?")) { await api(`/api/recordings/${encodeURIComponent(sid)}`, "DELETE"); await loadRecs(); }
}));
$("#zipAll").onclick = () => location.href = "/api/zip";
async function loadRecs() { recs = await api("/api/recordings"); renderRecs(); }

/* ---------------- refresh loop ---------------- */
function renderHeader() {
  const c = S.sensors.filter(s => s.state === "connected").length;
  $("#hstat").innerHTML = `<span class="pill ${c ? "ok" : ""}">${c} of ${S.sensors.length} connected</span>` +
    (S.scan.active ? `<span class="pill blue"><span class="spin"></span>Scanning…</span>` : "") +
    ((S.pending || []).length ? `<span class="pill warn">${S.pending.length} take${S.pending.length === 1 ? "" : "s"} waiting</span>` : "") +
    (S.recording.phase !== "idle" ? `<span class="pill err">${{downloading:"Downloading",saving:"Saving"}[S.recording.phase] || "Recording"}</span>` : "");
  const sb = $("#scanBtn"); sb.disabled = S.scan.active || S.recording.phase !== "idle"; sb.textContent = S.scan.active ? "Scanning…" : "Find sensors";
}
async function refresh() {
  const first = !S;
  S = await api("/api/state");
  if (first) { initSetup(); await loadRecs(); lastNoticeId = S.notice.id; }
  const s = JSON.stringify([S.sensors, S.recording.phase]);
  if (s !== sig) { sig = s; renderSensors(); }
  renderHeader(); renderRecordStatic(); renderLive(); renderPending(); renderLivePanel();
  if (S.notice.id !== lastNoticeId) { lastNoticeId = S.notice.id; toast(S.notice.text, S.notice.level); await loadRecs(); }
  if (S.scan.error && S.scan.error !== lastScanErr) toast(S.scan.error, "err");
  lastScanErr = S.scan.error;
  lastPhase = S.recording.phase;
}
(async function loop() { try { await refresh(); } catch (e) { $("#hstat").innerHTML = `<span class="pill err">Cannot reach the server</span>`; } setTimeout(loop, 450); })();
</script>
</body>
</html>
